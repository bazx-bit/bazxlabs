name: 14-Day Elite Warmup Engine

on:
  schedule:
    # Runs every 45 minutes between 04:00 UTC and 14:00 UTC (09:30 AM to 07:30 PM IST business hours)
    - cron: '*/45 4-14 * * *'
  workflow_dispatch: # Allows manual trigger button anytime

jobs:
  warmup-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Safety limit - each run finishes in under 45 seconds
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inject WARMUP_ENV Secret (1-Click Setup)
        env:
          WARMUP_ENV_DATA: ${{ secrets.WARMUP_ENV }}
        run: |
          if [ -n "$WARMUP_ENV_DATA" ]; then
            echo "$WARMUP_ENV_DATA" > .env
          fi

      - name: Execute Warmup Tick (Spam Rescue + Staggered Human Send)
        env:
          HERO_EMAIL: ${{ secrets.HERO_EMAIL }}
          HERO_PASSWORD: ${{ secrets.HERO_PASSWORD }}
          SEED_1_EMAIL: ${{ secrets.SEED_1_EMAIL }}
          SEED_1_PASSWORD: ${{ secrets.SEED_1_PASSWORD }}
          SEED_2_EMAIL: ${{ secrets.SEED_2_EMAIL }}
          SEED_2_PASSWORD: ${{ secrets.SEED_2_PASSWORD }}
          SEED_3_EMAIL: ${{ secrets.SEED_3_EMAIL }}
          SEED_3_PASSWORD: ${{ secrets.SEED_3_PASSWORD }}
          SEED_4_EMAIL: ${{ secrets.SEED_4_EMAIL }}
          SEED_4_PASSWORD: ${{ secrets.SEED_4_PASSWORD }}
          SEED_5_EMAIL: ${{ secrets.SEED_5_EMAIL }}
          SEED_5_PASSWORD: ${{ secrets.SEED_5_PASSWORD }}
          SEED_6_EMAIL: ${{ secrets.SEED_6_EMAIL }}
          SEED_6_PASSWORD: ${{ secrets.SEED_6_PASSWORD }}
          SEED_7_EMAIL: ${{ secrets.SEED_7_EMAIL }}
          SEED_7_PASSWORD: ${{ secrets.SEED_7_PASSWORD }}
          SEED_8_EMAIL: ${{ secrets.SEED_8_EMAIL }}
          SEED_8_PASSWORD: ${{ secrets.SEED_8_PASSWORD }}
        run: |
          python engine.py --tick

      - name: Persist State Back to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update warmup state [skip ci]" && git push)
