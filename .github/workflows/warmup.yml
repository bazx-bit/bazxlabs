name: 14-Day Elite Warmup Engine (Autonomous Session)

on:
  schedule:
    # STAGGERED MORNING TRIGGERS — GitHub cron is unreliable on public repos,
    # so we fire 3 attempts in the morning window. The engine's 'auto' mode
    # ensures only 1 session runs meaningfully (later triggers exit early if
    # business hours are already over or session would be too short).
    # Attempt 1: 03:00 UTC = 08:30 AM IST
    - cron: '0 3 * * *'
    # Attempt 2: 03:30 UTC = 09:00 AM IST
    - cron: '30 3 * * *'
    # Attempt 3: 04:00 UTC = 09:30 AM IST
    - cron: '0 4 * * *'
    # BACKUP AFTERNOON: If ALL morning triggers get skipped
    # 09:00 UTC = 02:30 PM IST
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows 1-click manual start anytime from GitHub UI

concurrency:
  group: warmup-engine
  cancel-in-progress: false

jobs:
  warmup-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Max safety limit allowed by GitHub Actions (6 hours)
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity for Live Cloud Commits
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Inject WARMUP_ENV Secret (1-Click Setup)
        env:
          WARMUP_ENV_DATA: ${{ secrets.WARMUP_ENV }}
        run: |
          if [ -n "$WARMUP_ENV_DATA" ]; then
            echo "$WARMUP_ENV_DATA" > .env
          fi

      - name: Run Warmup Session (Continuous Human-Paced Execution)
        env:
          WARMUP_ENV: ${{ secrets.WARMUP_ENV }}
          WARMUP_ENV_DATA: ${{ secrets.WARMUP_ENV }}
        run: |
          python engine.py --session auto

      - name: Final State Sync to Repository
        if: always()
        run: |
          git add state.json
          git diff --staged --quiet || (git commit -m "Auto-update warmup state [final session sync] [skip ci]" && git push)
