name: 14-Day Elite Warmup Engine

on:
  schedule:
    # Runs at minute 15 & 45 of every hour between 04:00 UTC and 14:00 UTC (09:45 AM to 07:45 PM IST daylight hours)
    # Offsetting from minute 0 avoids GitHub Actions top-of-hour shared runner queuing delays
    - cron: '15,45 4-14 * * *'
  workflow_dispatch: # Allows manual trigger button anytime

jobs:
  warmup-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Safety limit - each run finishes in under 20 seconds
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inject WARMUP_ENV Secret (1-Click Setup)
        env:
          WARMUP_ENV_DATA: ${{ secrets.WARMUP_ENV }}
        run: |
          if [ -n "$WARMUP_ENV_DATA" ]; then
            echo "$WARMUP_ENV_DATA" > .env
          fi

      - name: Execute Warmup Tick (Targeted Spam Rescue + Staggered Human Send)
        env:
          WARMUP_ENV: ${{ secrets.WARMUP_ENV }}
          WARMUP_ENV_DATA: ${{ secrets.WARMUP_ENV }}
        run: |
          python engine.py --tick

      - name: Persist State Back to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update warmup state [skip ci]" && git push)
