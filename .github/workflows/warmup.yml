name: 14-Day Elite Warmup Engine (Autonomous Session)

on:
  schedule:
    # 2 core daylight sessions per day (mimicking an authentic agency working schedule):
    # Session 1: 04:30 UTC = 10:00 AM IST (runs for 3.5 hours)
    # Session 2: 09:00 UTC = 02:30 PM IST (runs for 3.5 hours)
    - cron: '30 4 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows 1-click manual start anytime from GitHub UI

jobs:
  warmup-session:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # Safety limit - allows up to 5 hours of continuous human-paced session
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity for Live Cloud Commits
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Inject WARMUP_ENV Secret (1-Click Setup)
        env:
          WARMUP_ENV_DATA: ${{ secrets.WARMUP_ENV }}
        run: |
          if [ -n "$WARMUP_ENV_DATA" ]; then
            echo "$WARMUP_ENV_DATA" > .env
          fi

      - name: Run Warmup Session (Continuous Human-Paced Execution)
        env:
          WARMUP_ENV: ${{ secrets.WARMUP_ENV }}
          WARMUP_ENV_DATA: ${{ secrets.WARMUP_ENV }}
        run: |
          python engine.py --session 3.5

      - name: Final State Sync to Repository
        if: always()
        run: |
          git add state.json
          git diff --staged --quiet || (git commit -m "Auto-update warmup state [final session sync] [skip ci]" && git push)
